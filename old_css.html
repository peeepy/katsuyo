<style>
  :root{
    --ink:#221d17; --ink-soft:#544a3c; --muted:#8a7b63;
    --paper:#e9dfc7; --card:#f4ecd8; --card-2:#efe4cb;
    --line:#c9b98e; --line-soft:#dccfa9;
    --hanko:#b23a29; --hanko-dark:#8c2b1d;
    --indigo:#33465c;
    --good:#3c6e4a; --radius:6px;
    --shadow: 0 1px 0 rgba(34,29,23,.06), 0 8px 24px -12px rgba(34,29,23,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(var(--paper),var(--paper));
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .jp{font-family:'Zen Kaku Gothic New', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;}
  #app{max-width:640px;margin:0 auto;padding:28px 18px 64px;}
  .hidden{display:none !important;}

  /* ---------- hero ---------- */
  .hero{text-align:center;margin-bottom:26px;}
  .eyebrow{
    font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--hanko); font-weight:700; margin-bottom:10px;
  }
  .hero h1{
    font-family: inherit; font-weight:900;
    font-size:clamp(2.6rem, 9vw, 4rem); margin:0 0 6px;
    letter-spacing:.04em; color:var(--ink);
  }
  .hero .sub{
    font-size:1rem; color:var(--ink-soft); margin:0 0 4px; font-weight:700;
  }
  .hero .desc{font-size:.86rem; color:var(--muted); margin:0;}

  /* ---------- cards ---------- */
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:22px 20px; box-shadow:var(--shadow);
    position:relative;
  }
  .card + .card{margin-top:16px;}

  /* ---------- form rows ---------- */
  .field{margin-bottom:20px;}
  .field:last-child{margin-bottom:0;}
  .field label.field-label{
    display:block; font-size:.72rem; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px;
  }
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{
    width:38px; height:38px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--card-2); color:var(--ink); font-size:1.2rem; font-weight:700; cursor:pointer;
    line-height:1;
  }
  .stepper button:hover{background:var(--line-soft);}
  .stepper input{
    width:72px; text-align:center; font-size:1.1rem; font-weight:700; font-family:'Zen Kaku Gothic New',sans-serif;
    border:1px solid var(--line); border-radius:var(--radius); padding:8px 4px; background:#fffdf6; color:var(--ink);
  }
  select{
    width:100%; font-size:.95rem; padding:10px 12px; border-radius:var(--radius);
    border:1px solid var(--line); background:#fffdf6 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="%23544a3c" d="M7 10l5 5 5-5z"/></svg>') no-repeat right 12px center;
    appearance:none; -webkit-appearance:none; color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif;
  }
  select:focus, input:focus{outline:2px solid var(--indigo); outline-offset:1px;}

  .segmented{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .segmented button{
    flex:1; padding:11px 8px; background:var(--card-2); border:none; color:var(--ink-soft);
    font-size:.85rem; font-weight:700; cursor:pointer; font-family:'Zen Kaku Gothic New',sans-serif;
    border-right:1px solid var(--line);
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--indigo); color:#f4ecd8;}

  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{position:relative; width:46px; height:26px; flex-shrink:0;}
  .switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .switch .track{
    position:absolute; inset:0; background:var(--line-soft); border:1px solid var(--line);
    border-radius:14px; transition:background .15s;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#fffdf6; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s;
  }
  .switch input:checked + .track{background:var(--hanko);}
  .switch input:checked + .track + .knob{transform:translateX(20px);}

  .btn-row{display:flex; gap:12px; margin-top:24px;}
  .btn{
    flex:1; padding:13px 16px; border-radius:var(--radius); border:1px solid var(--line);
    font-weight:700; font-size:.92rem; cursor:pointer; font-family:'Zen Kaku Gothic New',sans-serif;
  }
  .btn-ghost{background:transparent; color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--card-2);}
  .btn-primary{background:var(--hanko); border-color:var(--hanko); color:#fbf2e2;}
  .btn-primary:hover{background:var(--hanko-dark);}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-wide{width:100%;}

  /* ---------- quiz ---------- */
  .quiz-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; padding:0 2px;}
  .quiz-top .progress{font-size:.85rem; color:var(--ink-soft); font-weight:700;}
  .quiz-top .streak{font-size:.85rem; font-weight:700; color:var(--hanko); display:flex; align-items:center; gap:6px;}
  .quiz-top .streak .dot{width:8px; height:8px; border-radius:50%; background:var(--hanko); display:inline-block;}

  .word-card{
    background:
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--line-soft) 39px, var(--line-soft) 40px),
      var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:30px 20px 26px;
    text-align:center; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stimulus{
    font-size:clamp(2rem, 9vw, 2.7rem); font-weight:700;
    line-height:1.5; letter-spacing:.02em; word-break:keep-all;
  }
  .stimulus ruby rt{font-size:.36em; color:var(--ink-soft); font-weight:700;}
  .instruction{
    margin-top:16px; font-size:.92rem; color:var(--indigo); font-weight:700;
  }
  .instruction .arrow{color:var(--hanko); margin-right:6px;}

  .answer-row{display:flex; gap:10px; margin-top:22px;}
  .answer-input{
    flex:1; font-size:1.3rem; padding:12px 14px; border-radius:var(--radius);
    border:1px solid var(--line); background:#fffdf6; color:var(--ink);
    letter-spacing:.05em; font-weight:500;
    background-image: repeating-linear-gradient(90deg, transparent, transparent 30px, var(--line-soft) 30px, var(--line-soft) 31px);
  }
  .answer-input:disabled{background:var(--card-2); color:var(--muted);}
  .hint{font-size:.72rem; color:var(--muted); margin-top:8px;}

  .feedback{margin-top:20px; padding-top:18px; border-top:1px dashed var(--line);}
  .stamp-row{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .stamp{
    font-family: inherit; font-size:2.6rem; font-weight:800; line-height:1;
    color:var(--hanko); border:4px solid var(--hanko); border-radius:50%;
    width:64px; height:64px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transform:rotate(-8deg); animation:stamp-in .28s ease-out;
  }
  .stamp.bad{color:var(--ink-soft); border-color:var(--ink-soft); transform:rotate(6deg);}
  @keyframes stamp-in{from{transform:scale(1.6) rotate(-8deg); opacity:0;} to{transform:scale(1) rotate(-8deg); opacity:1;}}
  .stamp-msg{font-weight:700; font-size:1.02rem;}
  .stamp-msg .correct-answer{font-size:1.3rem; display:block; margin-top:2px; font-weight: 700;}
  .stamp-msg .romaji{font-size:.78rem; color:var(--muted); font-weight:400;}
  .notes{margin:10px 0 0; padding-left:18px; font-size:.84rem; color:var(--ink-soft); line-height:1.5;}
  .notes li{margin-bottom:4px;}

  /* ---------- summary ---------- */
  .score-big{text-align:center; margin-bottom:6px;}
  .score-big .num{font-size:3rem; font-weight:800; color:var(--hanko);}
  .score-big .label{font-size:.85rem; color:var(--ink-soft); font-weight:700;}
  .stat-row{display:flex; justify-content:center; gap:28px; margin:14px 0 20px; font-size:.85rem; color:var(--ink-soft);}
  .stat-row b{color:var(--ink); font-size:1.1rem;}
  .missed-list{list-style:none; margin:0; padding:0;}
  .missed-list li{
    display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line-soft);
    font-size:.88rem;
  }
  .missed-list li:last-child{border-bottom:none;}
  .missed-list .ml-from{color:var(--muted);}
  .missed-list .ml-to{font-weight:700;}
  .empty-missed{text-align:center; color:var(--muted); font-size:.88rem; padding:10px 0;}

  @media (min-width:520px){
    .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  }
</style>
